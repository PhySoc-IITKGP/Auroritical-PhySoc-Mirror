<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f857a6" />
      <stop offset="100%" stop-color="#ff5858" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background subtle space mesh or field (can be omitted for transparency, but let's keep it transparent with styled paths) -->
  
  <!-- Wave function (sine wave) passing through the center representing quantum mechanics -->
  <path d="M 5 50 Q 27.5 15, 50 50 T 95 50" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  
  <!-- Outer Orbit 1 -->
  <ellipse cx="50" cy="50" rx="38" ry="12" fill="none" stroke="url(#primaryGrad)" stroke-width="2" transform="rotate(30 50 50)" stroke-dasharray="1 1" />
  <ellipse cx="50" cy="50" rx="38" ry="12" fill="none" stroke="url(#primaryGrad)" stroke-width="2" transform="rotate(30 50 50)" />
  
  <!-- Outer Orbit 2 -->
  <ellipse cx="50" cy="50" rx="38" ry="12" fill="none" stroke="url(#primaryGrad)" stroke-width="2" transform="rotate(-30 50 50)" />
  
  <!-- Outer Orbit 3 (Vertical alignment) -->
  <ellipse cx="50" cy="50" rx="38" ry="12" fill="none" stroke="url(#primaryGrad)" stroke-width="2" transform="rotate(90 50 50)" />

  <!-- Electrons/Particles on orbits -->
  <circle cx="50" cy="12" r="3" fill="#ffe259" filter="url(#glow)" transform="rotate(30 50 50)" />
  <circle cx="50" cy="88" r="3" fill="#00f2fe" filter="url(#glow)" transform="rotate(-30 50 50)" />
  <circle cx="12" cy="50" r="3" fill="#f857a6" filter="url(#glow)" transform="rotate(90 50 50)" />
  
  <!-- Center Nucleus/Quantum Particle -->
  <circle cx="50" cy="50" r="7.5" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="4" fill="#ffffff" />
</svg>
