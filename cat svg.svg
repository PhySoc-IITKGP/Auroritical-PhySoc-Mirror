<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Schrödinger's Cat Minimalist Apple-Style Line Art SVG -->
  <!-- White Fill Backing -->
  <ellipse cx="50" cy="62" rx="22" ry="18" fill="#ffffff" stroke="none" />
  <circle cx="50" cy="38" r="18" fill="#ffffff" stroke="none" />

  <!-- Tail -->
  <path d="M 28 65 Q 12 55 16 35 Q 18 25 24 28" fill="none" stroke="#000000" stroke-width="3.5" />

  <!-- Body Outline -->
  <path d="M 32 60 C 28 48, 38 42, 42 40 C 44 38, 56 38, 58 40 C 62 42, 72 48, 68 60 C 66 72, 58 78, 50 78 C 42 78, 34 72, 32 60 Z" fill="#ffffff" />

  <!-- Back Paws -->
  <path d="M 35 76 Q 30 78 36 82 Q 42 82 40 76" fill="none" />
  <path d="M 65 76 Q 70 78 64 82 Q 58 82 60 76" fill="none" />

  <!-- Front Paws -->
  <path d="M 44 74 Q 44 83 48 83" fill="none" />
  <path d="M 56 74 Q 56 81 52 81" fill="none" />

  <!-- Head Group -->
  <g id="head">
    <circle cx="50" cy="38" r="18" fill="#ffffff" />

    <!-- Left Ear -->
    <path d="M 34 26 L 38 12 L 46 22" fill="#ffffff" />
    <path d="M 37 23 L 39 16 L 43 21" stroke-width="2" fill="none" />

    <!-- Right Ear -->
    <path d="M 66 26 L 62 12 L 54 22" fill="#ffffff" />
    <path d="M 63 23 L 61 16 L 57 21" stroke-width="2" fill="none" />

    <!-- Curious Eyes -->
    <circle cx="43" cy="37" r="4.5" fill="#000000" stroke="none" />
    <circle cx="44.5" cy="35.5" r="1.5" fill="#ffffff" stroke="none" />

    <circle cx="57" cy="37" r="4.5" fill="#000000" stroke="none" />
    <circle cx="58.5" cy="35.5" r="1.5" fill="#ffffff" stroke="none" />

    <!-- Nose & Mouth -->
    <path d="M 48 44 L 52 44 L 50 46 Z" fill="#000000" stroke="none" />
    <path d="M 50 46 Q 46 50 43 48" fill="none" stroke-width="2.5" />
    <path d="M 50 46 Q 54 50 57 48" fill="none" strokeWidth="2.5" />

    <!-- Whiskers -->
    <path d="M 36 43 L 22 41" stroke-width="2" />
    <path d="M 36 46 L 24 47" stroke-width="2" />
    <path d="M 64 43 L 78 41" stroke-width="2" />
    <path d="M 64 46 L 76 47" stroke-width="2" />
  </g>
</svg>
